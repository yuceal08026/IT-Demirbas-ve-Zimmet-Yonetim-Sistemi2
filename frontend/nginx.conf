# Arayüzü sunar ve /api isteklerini API konteynerine aktarır.
# Tarayıcı için her şey tek adresten gelir: httpOnly cookie çalışır, CORS gerekmez.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Not: nginx'te bir location içinde add_header kullanılırsa üstteki başlıklar miras alınmaz;
    # bu yüzden aşağıdaki location'larda tekrarlanır.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://api:3000/health;
    }

    # Vite derlemesindeki dosya adları içerik özeti taşır; uzun süre önbelleğe alınabilir.
    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # İstemci tarafı yönlendirme (ör. /assets/12, /assets/code/IT-2026-000042) → index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
